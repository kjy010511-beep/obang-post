<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EADB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오방 우체국">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>오방 우체국</title>
<meta name="description" content="고민을 편지로 보내면 오방 타로 카드 세 장으로 답장이 도착해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap">
<style>
/* 한지 편지지 한 장: 가운데 좁은 기둥(최대 440px), 위는 현판 머리띠, 아래는 큰 버튼 하나 */
:root {
  --paper: #F3EADB;   /* 한지 */
  --sheet: #FBF6EC;   /* 편지지 */
  --sky: #F6E7C8;     /* 그림 하늘 */
  --ink: #1C1A17;     /* 먹 */
  --ink-soft: #4A4038;
  --blue: #1F3A5F;    /* 청 */
  --red: #B8322A;     /* 적 */
  --gold: #DDA233;    /* 황 */
  --green: #2F6B55;   /* 녹 */
  --rule: #D9C9A8;
  --display: 'Song Myung', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --body: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --gx-l: max(20px, env(safe-area-inset-left, 0px));
  --gx-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font-family: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app { max-width: 440px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid transparent; border-right: 1px solid transparent; }
@media (min-width: 480px) { .app { border-color: var(--ink); } }

.head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-left: var(--gx-l); padding-right: var(--gx-r);
  background: var(--paper); border-bottom: 1px solid var(--ink);
}
.head .l { display: flex; align-items: center; gap: 2px; min-width: 0; }
.back { width: 44px; height: 44px; margin-left: -12px; padding: 0; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; cursor: pointer; }
.back[hidden] { display: none !important; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .08em; color: var(--blue); white-space: nowrap; }
.badge { padding: 4px 12px; border-radius: 999px; background: var(--red); color: var(--sheet); font-size: 13px; font-weight: 700; white-space: nowrap; }

.screen { flex: 1; display: flex; flex-direction: column; animation: fadein .35s ease-out both; }
.pad { padding-left: var(--gx-l); padding-right: var(--gx-r); }
.art { display: block; width: 100%; height: auto; }
.copy { padding-block: 20px 0; text-align: center; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 29px; line-height: 1.3; text-wrap: balance; }
.lede { margin: 10px 0 0; font-size: 15px; line-height: 1.65; color: var(--ink-soft); text-wrap: balance; }
.foot { margin-top: auto; padding-block: 24px 28px; display: flex; flex-direction: column; gap: 10px; }
.btn { height: 56px; width: 100%; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--blue); color: var(--sheet); font-size: 18px; font-weight: 700; letter-spacing: .06em; cursor: pointer; }
.btn.red { background: var(--red); }
.btn.light { background: var(--sheet); color: var(--ink); font-size: 16px; height: 50px; }
.btn:active { transform: translateY(1px); }

/* 편지 쓰기 */
.sheet { background: var(--sheet); border: 1px solid var(--ink); box-shadow: inset 0 0 0 4px var(--sheet), inset 0 0 0 5px var(--red); }
.letter { margin-top: 22px; padding: 20px; display: flex; flex-direction: column; }
.letter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.letter label { font-family: var(--display); font-size: 19px; }
.small { font-size: 12px; color: var(--ink-soft); }
.hr { height: 1px; background: var(--ink); margin: 12px 0 6px; }
textarea {
  width: 100%; min-height: 288px; box-sizing: border-box; padding: 0; border: 0; resize: none;
  background: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  font-family: var(--body); font-size: 16px; line-height: 32px; color: var(--ink);
}
textarea::placeholder { color: #8A7E70; }
.count { margin-top: 8px; text-align: right; font-variant-numeric: tabular-nums; }
.err { margin: 12px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--red); }

/* 보내는 중 */
.sending { position: relative; background: var(--sky); overflow: hidden; min-height: 560px; }
.sending svg.bg { position: absolute; inset: auto 0 0 0; width: 100%; height: auto; }
.flyer { position: absolute; left: 50%; top: 30%; width: 160px; margin-left: -80px; animation: fly 1.6s ease-in .3s forwards; }
.sending .copy { position: relative; margin-top: 62%; }

/* 봉투 */
.env-wrap { display: flex; justify-content: center; padding-block: 40px 0; }
.env { position: relative; width: 320px; height: 210px; perspective: 900px; }
.env .body { position: absolute; inset: 0; padding: 6px; box-sizing: border-box; border: 1px solid var(--ink); background: repeating-linear-gradient(135deg, var(--red) 0 12px, var(--sheet) 12px 18px, var(--blue) 18px 30px, var(--sheet) 30px 36px); }
.env .body div { width: 100%; height: 100%; background: #E9D3A6; }
.env .pocket { position: absolute; left: 0; top: 0; z-index: 3; }
.env .addr { position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 4; font-size: 12px; line-height: 1.5; color: var(--ink-soft); }
.env .addr b { display: block; font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--ink); }
.env .flap { position: absolute; left: 6px; top: 6px; transform-origin: 50% 0; transition: transform .6s ease; z-index: 5; }
.env .seal { position: absolute; left: 132px; top: 96px; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; z-index: 6; }
.env .peek { position: absolute; left: 0; right: 0; top: 30px; height: 140px; z-index: 2; display: none; }
.env .peek img { position: absolute; width: 66px; height: 113px; box-shadow: 0 2px 0 var(--ink); }
.env.open .flap { transform: rotateX(180deg); z-index: 1; }
.env.open .seal { display: none; }
.env.open .peek { display: block; animation: popout .8s ease-out forwards; }

/* 오늘의 편지 */
.reveal { padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.today { padding: 20px; }
.today .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.today h1 { font-size: 24px; }
.quote { margin-top: 12px; padding: 10px 12px; background: var(--paper); border-left: 3px solid var(--gold); }
.quote .t { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.quote p { margin: 4px 0 0; font-size: 14px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.slots { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--ink); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: rise .6s ease-out both; }
.slot .lab { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.slot .dot { width: 8px; height: 8px; border-radius: 50%; }
.card { position: relative; width: 100%; aspect-ratio: 265 / 454; padding: 0; border: 0; background: transparent; cursor: pointer; perspective: 600px; border-radius: 4px; }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s ease; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 3px; }
.card .front { transform: rotateY(180deg); }
.card .front.rv { transform: rotateY(180deg) rotate(180deg); }
.card.up .inner { transform: rotateY(180deg); }
.card.sel { box-shadow: 0 0 0 3px var(--gold); }
.slot .dir { height: 16px; font-size: 12px; font-weight: 700; }
.hint { margin: 14px 0 0; text-align: center; font-size: 14px; color: var(--ink-soft); }
.detail { padding: 20px; animation: fadein .35s ease-out both; }
.detail .chips { display: flex; gap: 6px; }
.chip { padding: 3px 10px; border-radius: 999px; color: var(--sheet); font-size: 12px; font-weight: 700; }
.detail .name { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.detail .name img { width: 64px; height: auto; border-radius: 3px; box-shadow: 0 1px 0 var(--ink); }
.detail .name img.rv { transform: rotate(180deg); }
.detail h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; }
.detail .en { margin-top: 2px; font-size: 12px; letter-spacing: .14em; color: var(--blue); }
.detail .lead { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
.detail .sec { margin-top: 16px; }
.detail .sec .t { font-size: 13px; font-weight: 700; color: var(--red); }
.detail .sec p { margin: 4px 0 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
.kept { margin: 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--green); }

/* 보관함 */
.list { padding-block: 24px 28px; display: flex; flex-direction: column; gap: 12px; }
.item { display: block; width: 100%; padding: 14px 16px; text-align: left; cursor: pointer; }
.item .d { font-size: 12px; color: var(--ink-soft); }
.item .q { margin-top: 4px; font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item .c { margin-top: 8px; font-size: 13px; color: var(--blue); }
.empty { text-align: center; color: var(--ink-soft); font-size: 15px; line-height: 1.6; padding-block: 40px; }

/* 관리자 입구 */
.databad { margin: 12px 0 0; padding: 12px 14px; border: 1.5px solid var(--red); background: var(--sheet); color: var(--red); font-size: 14px; font-weight: 700; line-height: 1.55; }
.door { align-self: flex-end; margin: 4px -8px 0 0; display: inline-flex; align-items: center; gap: 4px; padding: 8px; border: 0; background: transparent; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
/* 운영자 공유 동의 */
.consent { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; font-size: 14px; line-height: 1.5; cursor: pointer; }
.consent input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--blue); flex: none; }
.consent small { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-soft); }
.note-s { margin: 0; text-align: center; font-size: 13px; color: var(--ink-soft); }
/* 번호 입력 */
.pin { flex: 1; padding-block: 36px 28px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.dots { display: flex; gap: 16px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink); }
.dots span.on { background: var(--blue); border-color: var(--blue); }
.dots.shake { animation: shake .4s; }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 22px; }
.key { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--sheet); font-family: var(--display); font-size: 26px; cursor: pointer; }
.key:active { background: var(--sky); }
.key.ghost { border-color: transparent; background: transparent; font-family: var(--body); font-size: 15px; }
.key:disabled { opacity: .5; }
@keyframes shake { 0%,100% { transform: none } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
/* 관리실 */
.admin { padding-block: 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.admin .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.note { padding: 10px 12px; font-size: 13px; line-height: 1.55; background: var(--sky); border: 1px solid var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 10px 4px; text-align: center; border: 1px solid var(--ink); border-radius: 6px; background: var(--sheet); cursor: pointer; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-soft); }
.stat.on { background: var(--blue); color: var(--sheet); border-color: var(--blue); }
.stat.on span { color: var(--sheet); }
.search { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--ink); border-radius: 6px; background: var(--sheet); font-family: var(--body); font-size: 15px; color: var(--ink); }
.alist { display: flex; flex-direction: column; gap: 12px; }
.arow { padding: 14px 16px; }
.arow .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.arow .q { margin: 8px 0 0; font-size: 15px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.minis { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 14px; }
.mini { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.35; }
.mini img { width: 26px; height: auto; border-radius: 2px; flex: none; }
.mini img.rv { transform: rotate(180deg); }
.arow .btns { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.arow .more { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); display: flex; flex-direction: column; gap: 12px; }
.arow .more .t { font-size: 13px; font-weight: 700; color: var(--red); }
.arow .more p { margin: 4px 0 0; font-size: 14px; line-height: 1.7; white-space: pre-line; }
.tbtn { height: 40px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--sheet); font-size: 14px; font-weight: 700; cursor: pointer; }
.tbtn.red { background: var(--red); color: var(--sheet); }
.confirm { width: 100%; font-size: 13px; color: var(--red); font-weight: 700; }

.sunlink { cursor: pointer; }
.sunring { transform-origin: 318px 76px; animation: sunring 2.6s ease-in-out infinite; }
@keyframes sunring { 0%,100% { opacity: .2; transform: scale(.95) } 50% { opacity: .9; transform: scale(1.12) } }
/* 이어지는 편지 */
.link { padding-block: 18px 28px; display: flex; flex-direction: column; gap: 14px; }
.lbox { padding: 16px; }
.lbox .t { font-family: var(--display); font-size: 21px; }
.lbox .sub { margin: 4px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.mine3 { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mine3 div { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 12px; }
.mine3 img { width: 54px; height: auto; border-radius: 2px; box-shadow: 0 1px 0 var(--ink); }
.mine3 img.rv { transform: rotate(180deg); }
.mine3 b { font-size: 12px; color: var(--red); }
.mine3 span { line-height: 1.4; }
.code { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--paper); border: 1px dashed var(--ink); }
.code b { font-size: 20px; letter-spacing: .08em; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
.field { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--ink); border-radius: 6px; background: var(--sheet); font-family: var(--body); font-size: 16px; color: var(--ink); }
.frow { margin-top: 10px; display: flex; gap: 8px; }
.frow .field { flex: 1; min-width: 0; text-transform: uppercase; }
.pct { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pct b { font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--red); font-variant-numeric: tabular-nums; }
.pct span { font-size: 14px; font-weight: 700; }
.srows { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.srows li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
.srows li b { font-variant-numeric: tabular-nums; color: var(--steel, #7D7A74); }
.srows li.ok { color: var(--ink); }
.srows li.ok b { color: var(--red); }
.srows em { font-style: normal; font-weight: 700; margin-right: 4px; }
.res { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); }
.consent2 { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.55; }
.consent2 label.ck { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.consent2 input[type=checkbox] { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--blue); flex: none; }
.rules { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
.cand { padding: 14px 0; border-top: 1px dashed var(--rule); display: flex; flex-direction: column; gap: 4px; }
.cand:first-child { border-top: 0; }
.cand .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cand .h b { font-size: 16px; }
.cand .pb { font-family: var(--display); font-size: 22px; color: var(--red); font-variant-numeric: tabular-nums; }
.room { padding: 12px 0; border-top: 1px dashed var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.room:first-child { border-top: 0; }
.lerr { margin: 8px 0 0; font-size: 13px; font-weight: 700; color: var(--red); }
/* 대화 */
.chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat .info { padding-block: 10px; font-size: 13px; color: var(--ink-soft); border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.msgs { flex: 1; padding-block: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 300px; }
.bub { max-width: 78%; padding: 9px 12px; border-radius: 14px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.me { align-self: flex-end; background: var(--blue); color: var(--sheet); border-bottom-right-radius: 4px; }
.bub.you { align-self: flex-start; background: var(--sheet); border: 1px solid var(--ink); border-bottom-left-radius: 4px; }
.bub small { display: block; margin-top: 3px; font-size: 11px; opacity: .75; }
.sys { align-self: center; font-size: 13px; color: var(--ink-soft); text-align: center; line-height: 1.6; }
.compose { position: sticky; bottom: 0; padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1px solid var(--ink); display: flex; flex-direction: column; gap: 8px; }
.compose .rowc { display: flex; gap: 8px; align-items: flex-end; }
.compose textarea { flex: 1; min-width: 0; min-height: 46px; max-height: 120px; padding: 10px 12px; border: 1px solid var(--ink); border-radius: 6px; background: var(--sheet); font-family: var(--body); font-size: 16px; line-height: 1.5; resize: none; background-image: none; }
.compose .send { height: 46px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--blue); color: var(--sheet); font-weight: 700; font-size: 15px; cursor: pointer; }
.warn { padding: 10px 12px; border: 1.5px solid var(--red); background: var(--sheet); font-size: 13px; line-height: 1.55; display: flex; flex-direction: column; gap: 8px; }
.warn .b { display: flex; gap: 8px; flex-wrap: wrap; }
.chatmenu { display: flex; gap: 8px; flex-wrap: wrap; }
.field.sel { appearance: auto; }

@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes peekmail { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
@keyframes popout { from { transform: translateY(60px) } to { transform: translateY(-70px) } }
@keyframes fly { 0% { transform: none; opacity: 1 } 25% { transform: translateY(12px); opacity: 1 } 100% { transform: translate(150px,-330px) rotate(-18deg) scale(.35); opacity: 0 } }
@keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
.peekmail { animation: peekmail 2.4s ease-in-out infinite; }
.twinkle { animation: twinkle 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<template id="t-write">
  <div class="copy pad" style="text-align:left; padding-block: 28px 0">

  </div>
  <div class="foot pad">
    <button class="btn" type="button" data-act="send">편지 보내기</button>

</template>

// ───────── 이어지는 편지 (상황·결과가 비슷하고 조언이 이어지는 사람) ─────────
const LINK_KEY = 'obang-link-v1';

const NICK_A = ['푸른', '붉은', '노란', '하얀', '검은', '초록', '보랏빛', '금빛'];
const NICK_B = ['까치', '호랑이', '해치', '두루미', '사슴', '거북', '토끼', '봉황', '다람쥐', '잉어'];

const stanceOf = (c) => STANCE[c[0]][c[1]];
function encodeLink(m) { return 'OB-' + [m.sit, m.res, m.adv].map((c) => (c[0] * 2 + c[1]).toString(36).toUpperCase().padStart(2, '0')).join('-'); }
function decodeLink(code) {
  const m = String(code || '').toUpperCase().replace(/\s/g, '').match(/^OB-?([0-9A-Z]{2})-?([0-9A-Z]{2})-?([0-9A-Z]{2})$/);

const elOf = (i) => (i < 22 ? 0 : 1 + Math.floor((i - 22) / 14));

const FLOW_NEAR = ['성장|시작', '관계|성장', '시작|전환', '갈등|시련', '멈춤|시련']; // 비슷한 흐름

function flowPart(a, b) {
  const ta = themeOf(a), tb = themeOf(b), same = a[0] === b[0];
  if (same && ta === tb) return { p: SCORE.flow.sameCard, why: '같은 카드(' + DECK[a[0]][0] + ')가 같은 흐름으로 나왔어요' };
  if (ta === tb && elOf(a[0]) === elOf(b[0])) return { p: SCORE.flow.sameFlowSameEl, why: '둘 다 ‘' + ta + '’ 흐름이고, 같은 ' + EL_NAMES[elOf(a[0])] + ' 기운이에요' };
  if (ta === tb) return { p: SCORE.flow.sameFlow, why: '둘 다 ‘' + ta + '’ 흐름이에요 (카드는 달라요)' };

  if (FLOW_NEAR.indexOf(ta + '|' + tb) >= 0 || FLOW_NEAR.indexOf(tb + '|' + ta) >= 0) return { p: SCORE.flow.nearFlow, why: '‘' + ta + '’와 ‘' + tb + '’, 비슷한 흐름이에요' };

}
function advPart(a, b) {

  if (pair && same) return { p: SCORE.adv.pairSameCard, why: '같은 카드(' + DECK[a[0]][0] + ')의 앞뒤로 ' + mesh };

  if (pair) return { p: SCORE.adv.pair, why: mesh };
  if (same) return { p: SCORE.adv.sameCard, why: '같은 카드(' + DECK[a[0]][0] + ')의 조언을 받았어요' };
  return { p: 0, why: '나는 ‘' + sa + '’, 상대는 ‘' + sb + '’예요' };
}
function linkScore(a, b) {
  const sit = flowPart(a.sit, b.sit), res = flowPart(a.res, b.res), adv = advPart(a.adv, b.adv);
  return { sit, res, adv, pct: sit.p + res.p + adv.p };
}
function pctWord(p) { return p >= 80 ? '아주 잘 어울려요' : p >= 50 ? '잘 어울려요' : p >= 25 ? '어울리는 편이에요' : p > 0 ? '조금 이어져 있어요' : '이어지는 곳이 아직 없어요'; }
function scoreRows(me, other, sc) {
  const row = (part, label) => '<li class="' + (part.p ? 'ok' : '') + '"><b>' + (part.p ? '+' + part.p + '%' : '0%') + '</b><span><em>' + label + '</em>' + esc(part.why) + '</span></li>';
  return '<ul class="srows">' + row(sc.sit, '상황') + row(sc.res, '결과') + row(sc.adv, '조언') + '</ul>';
}

async function linkAuth() {
  const ok = await initFirebase();
  if (!ok) throw new Error(FB.error || '서버에 연결하지 못했어요.');
  if (!FB.auth.currentUser) await FB.auth.signInAnonymously();
  L.uid = FB.auth.currentUser.uid;
  return L.uid;
}
function watchRooms() {
  if (L.unsubRooms || !FB.ready || !L.uid) return;
  const side = { a: [], b: [] };
  const apply = (k, snap) => {
    side[k] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    L.allRooms = side.a.concat(side.b);
    onRoomsChanged();
  };
  const u1 = FB.db.collection('rooms').where('a', '==', L.uid).onSnapshot((sn) => apply('a', sn), () => {});
  const u2 = FB.db.collection('rooms').where('b', '==', L.uid).onSnapshot((sn) => apply('b', sn), () => {});
  L.unsubRooms = () => { u1(); u2(); };
}
function liveRooms() { return L.allRooms.filter((r) => r.status !== 'closed'); }
function incoming() { return liveRooms().filter((r) => r.status === 'pending' && r.b === L.uid); }
function updateLinkBtn() {
  const b = document.getElementById('link-btn');
  if (!b) return;
  const st = loadLinkState();

function onRoomsChanged() {
  if (S.screen === 'home') updateLinkBtn();

  if (S.screen === 'chat') renderChatHead();
}
async function loadPool() {
  const since = firebase.firestore.Timestamp.fromMillis(Date.now() - 7 * 864e5);
  const snap = await FB.db.collection('pool').where('at', '>', since).orderBy('at', 'desc').limit(200).get();
  L.pool = snap.docs.filter((d) => d.id !== L.uid).map((d) => Object.assign({ uid: d.id }, d.data()))
    .filter((x) => validReading(x) && typeof x.nick === 'string');
}
async function joinPool(me, nick) {
  await linkAuth();
  await FB.db.collection('pool').doc(L.uid).set({
    nick: nick, sit: me.sit, res: me.res, adv: me.adv, topic: topicOf(S.q || ''),
    at: firebase.firestore.FieldValue.serverTimestamp(),
  });
  saveLinkState({ joined: true, nick: nick, me: me });
  watchRooms();
}
async function leavePool() {
  try { await linkAuth(); await FB.db.collection('pool').doc(L.uid).delete(); } catch (e) {}
  const st = loadLinkState(); saveLinkState({ joined: false, nick: st.nick || '' });
  L.pool = [];
}

async function askChat(uid) {

const CONTACT_RE = /(01[016789][-\s.]?\d{3,4}[-\s.]?\d{4})|(\d{2,3}[-\s.]\d{3,4}[-\s.]\d{4})|카톡|카카오|오픈채팅|인스타|텔레그램|instagram|kakao|telegram|line\s?id|@[a-z0-9_.]{3,}/i;
async function sendMsg(force) {
  const ta = document.getElementById('chat-text'); if (!ta) return;
  const text = ta.value.trim().slice(0, 500);
  if (!text) return;
  if (!force && CONTACT_RE.test(text)) { L.pendingSend = text; renderCompose(); document.getElementById('chat-text').value = text; return; }
  L.pendingSend = null;
  ta.value = '';
  try {
    await FB.db.collection('rooms').doc(L.room).collection('msgs').add({ from: L.uid, text: text, at: firebase.firestore.FieldValue.serverTimestamp() });
    FB.db.collection('rooms').doc(L.room).update({ last: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
  } catch (e) { ta.value = text; }
  renderCompose();
  const t2 = document.getElementById('chat-text'); if (t2) t2.focus();
}
async function sendReport() {
  const sel = document.getElementById('report-reason');
  const reason = sel ? sel.value : '기타';
  try { await FB.db.collection('reports').add({ room: L.room, from: L.uid, reason: reason, at: firebase.firestore.FieldValue.serverTimestamp() }); } catch (e) {}
  await setRoomStatus(L.room, 'closed');

  go('link');
}


// ───────── 관리자 ─────────
// 서버(Firebase)를 연결하지 않았을 때 쓰는 번호. 연결한 뒤에는 Firebase 관리자 계정 비밀번호('obang-' + 번호)로 확인해요.
const LOCAL_PIN = '7189';
const TOPICS = ['전체', '연애', '관계', '일', '공부', '돈', '마음', '일반'];
const A = { pin: '', busy: false, list: [], filter: '전체', query: '', open: null, confirm: null, loading: false, error: '', mode: 'local' };
const FB = { ready: false, db: null, auth: null, adminDb: null, adminAuth: null, error: '' };
let fbPromise = null;

function fbConfigured() { return !!(window.OBANG_FIREBASE && window.OBANG_FIREBASE.apiKey); }
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}
function initFirebase() {
  if (!fbConfigured()) return Promise.resolve(false);
  if (FB.ready) return Promise.resolve(true);
  if (fbPromise) return fbPromise;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  fbPromise = loadScript(base + 'firebase-app-compat.js')
    .then(() => loadScript(base + 'firebase-auth-compat.js'))
    .then(() => loadScript(base + 'firebase-firestore-compat.js'))
    .then(() => {
      if (!firebase.apps.length) firebase.initializeApp(window.OBANG_FIREBASE);
      FB.db = firebase.firestore(); FB.auth = firebase.auth();
      // 관리자는 따로 로그인해서, 같은 폰의 사용자 연결(익명 로그인)과 섞이지 않게 해요
      const adminApp = firebase.apps.find((a) => a.name === 'admin') || firebase.initializeApp(window.OBANG_FIREBASE, 'admin');
      FB.adminDb = adminApp.firestore(); FB.adminAuth = adminApp.auth();
      FB.ready = true; FB.error = '';
      return true;
    })
    .catch(() => { FB.error = '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'; fbPromise = null; return false; });
  return fbPromise;
}
function shareLetter(rec) {
  return initFirebase().then((ok) => {
    if (!ok) throw new Error('offline');
    return FB.db.collection('letters').add({ q: rec.q, drawn: rec.drawn, rev: rec.rev, topic: topicOf(rec.q), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  });
}
function fmtTime(t) { const d = new Date(t); return fmtDate(t) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function updateDots() {
  const d = document.getElementById('dots');
  if (!d) return;
  d.querySelectorAll('span').forEach((x, i) => x.classList.toggle('on', i < A.pin.length));
}
function pinError(msg) {
  A.pin = ''; A.busy = false; updateDots();
  const e = document.getElementById('pin-err'); if (e) { e.textContent = msg; e.hidden = false; }
  const d = document.getElementById('dots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  view.querySelectorAll('.key').forEach((k) => { k.disabled = false; });
}
function pressKey(k) {
  if (A.busy) return;
  const e = document.getElementById('pin-err'); if (e) e.hidden = true;
  if (k === 'del') A.pin = A.pin.slice(0, -1);
  else if (A.pin.length < 4) A.pin += k;
  updateDots();
  if (A.pin.length === 4) submitPin();
}
async function submitPin() {
  A.busy = true;
  view.querySelectorAll('.key').forEach((k) => { k.disabled = true; });
  const pin = A.pin;
  if (fbConfigured()) {
    const ok = await initFirebase();
    if (!ok) return pinError(FB.error);
    try {
      await FB.adminAuth.signInWithEmailAndPassword(window.OBANG_ADMIN_EMAIL, 'obang-' + pin);
      A.mode = 'server';
    } catch (err) {
      const c = err && err.code;
      if (c === 'auth/too-many-requests') return pinError('여러 번 틀려서 잠시 막혔어요. 조금 뒤에 다시 해 주세요.');
      if (c === 'auth/network-request-failed') return pinError('인터넷에 연결되어 있지 않아요.');
      return pinError('번호가 맞지 않아요.');
    }
  } else {
    if (pin !== LOCAL_PIN) return pinError('번호가 맞지 않아요.');
    A.mode = 'local';
  }
  A.busy = false; A.pin = '';
  Object.assign(A, { filter: '전체', query: '', open: null, confirm: null });
  go('admin');
}

function renderAdmin() {
  view.innerHTML =
    '<div class="admin pad">' +
      '<div class="top"><h1 style="font-size:26px">관리실</h1><button class="tbtn" type="button" data-act="logout">나가기</button></div>' +
      (A.mode === 'local' ? '<p class="note">서버가 아직 연결되지 않아서 <b>이 기기에 보관된 편지만</b> 보여요. firebase-config.js를 채우면 모든 사용자가 보낸 편지가 여기에 모여요.</p>'
        : '<p class="note">사용자가 ‘운영자에게도 보내요’에 동의하고 보관한 편지만 모여요.</p>') +
      '<p class="small" id="admin-sum" style="margin:0; font-size:14px"></p>' +
      '<div class="stats" id="admin-stats"></div>' +
      '<input class="search" id="admin-q" type="search" placeholder="편지 내용으로 찾기" aria-label="편지 내용으로 찾기" value="' + esc(A.query) + '">' +
      '<div id="admin-reports"></div>' +
      '<div class="alist" id="admin-list"></div>' +
    '</div>';
  document.getElementById('admin-q').addEventListener('input', (e) => { A.query = e.target.value; renderAdminList(); });
  renderAdminStats(); renderAdminList(); fetchAdmin();
}
async function fetchAdmin() {
  A.loading = true; A.error = ''; renderAdminList();
  try {
    if (A.mode === 'server') {
      const snap = await FB.adminDb.collection('letters').orderBy('createdAt', 'desc').limit(1000).get();
      try {
        const rs = await FB.adminDb.collection('reports').orderBy('at', 'desc').limit(100).get();
        A.reports = rs.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      } catch (e) { A.reports = []; }
      A.list = snap.docs.map((d) => {
        const x = d.data();
        return { id: d.id, q: x.q || '', drawn: x.drawn || [], rev: x.rev || [], topic: x.topic || topicOf(x.q || ''), date: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : Date.now() };
      });
    } else {
      A.list = loadLetters().slice().reverse().map((l) => Object.assign({}, l, { topic: topicOf(l.q || '') }));
    }
    A.list = A.list.filter((l) => Array.isArray(l.drawn) && l.drawn.length === 3 && l.drawn.every((i) => DECK[i]));
  } catch (err) {
    A.error = '편지를 불러오지 못했어요. Firebase 보안 규칙의 관리자 UID를 확인해 주세요.';
  }
  A.loading = false;
  if (S.screen === 'admin') { renderAdminStats(); renderAdminList(); renderReports(); }
}
function renderReports() {
  const box = document.getElementById('admin-reports'); if (!box) return;
  const list = A.reports || [];
  if (A.mode !== 'server' || !list.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<section class="sheet arow" style="box-shadow:none; border-color:var(--red)">' +
    '<div class="h"><b style="color:var(--red)">대화 신고 ' + list.length + '건</b></div>' +
    list.map((r) => {
      const t = r.at && r.at.toMillis ? fmtTime(r.at.toMillis()) : '';
      const open = A.repOpen === r.id;
      return '<div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule)">' +
        '<div class="small">' + t + ' · ' + esc(r.reason || '') + '</div>' +
        '<div class="btns"><button class="tbtn" type="button" data-act="repview" data-id="' + esc(r.id) + '" data-room="' + esc(r.room || '') + '">' + (open ? '대화 접기' : '대화 보기') + '</button>' +
        '<button class="tbtn" type="button" data-act="repdone" data-id="' + esc(r.id) + '">처리 완료</button></div>' +
        (open ? '<div class="more">' + (A.repMsgs || []).map((m) => '<p style="margin:0"><b>' + (m.from === (A.repRoom && A.repRoom.a) ? esc((A.repRoom.names || {})[A.repRoom.a] || 'A') : esc(((A.repRoom || {}).names || {})[(A.repRoom || {}).b] || 'B')) + '</b> ' + esc(m.text) + '</p>').join('') + '</div>' : '') +
      '</div>';
    }).join('') + '</section>';
}
async function viewReport(id, room) {
  if (A.repOpen === id) { A.repOpen = null; renderReports(); return; }
  A.repOpen = id; A.repMsgs = []; A.repRoom = null;
  try {
    const rd = await FB.adminDb.collection('rooms').doc(room).get();
    A.repRoom = rd.exists ? rd.data() : null;
    const ms = await FB.adminDb.collection('rooms').doc(room).collection('msgs').orderBy('at').limit(300).get();
    A.repMsgs = ms.docs.map((d) => d.data());
  } catch (e) { A.repMsgs = [{ from: '', text: '대화를 불러오지 못했어요.' }]; }
  renderReports();
}
async function reportDone(id) {
  try { await FB.adminDb.collection('reports').doc(id).delete(); A.reports = A.reports.filter((r) => r.id !== id); } catch (e) {}
  renderReports();
}
function renderAdminStats() {
  const box = document.getElementById('admin-stats'); if (!box) return;
  const count = (t) => t === '전체' ? A.list.length : A.list.filter((l) => l.topic === t).length;
  box.innerHTML = TOPICS.map((t) => '<button type="button" class="stat' + (A.filter === t ? ' on' : '') + '" data-act="afilter" data-t="' + t + '" aria-pressed="' + (A.filter === t) + '"><b>' + count(t) + '</b><span>' + t + '</span></button>').join('');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const sum = document.getElementById('admin-sum');
  if (sum) sum.textContent = '보관된 편지 ' + A.list.length + '통 · 오늘 ' + A.list.filter((l) => l.date >= today.getTime()).length + '통';
}
function renderAdminList() {
  const box = document.getElementById('admin-list'); if (!box) return;
  if (A.loading) { box.innerHTML = '<p class="empty">편지를 불러오는 중이에요…</p>'; return; }
  if (A.error) { box.innerHTML = '<p class="empty" style="color:var(--red)">' + esc(A.error) + '</p>'; return; }
  const q = A.query.trim();
  const items = A.list.filter((l) => (A.filter === '전체' || l.topic === A.filter) && (!q || l.q.indexOf(q) >= 0));
  if (!items.length) { box.innerHTML = '<p class="empty">' + (A.list.length ? '조건에 맞는 편지가 없어요.' : '아직 보관된 편지가 없어요.') + '</p>'; return; }
  box.innerHTML = items.map((l) => {
    const open = A.open === l.id;
    const minis = l.drawn.map((idx, i) => '<span class="mini"><img class="' + (l.rev[i] ? 'rv' : '') + '" src="' + img(idx) + '" alt=""><span><b>' + LABELS[i] + '</b><br>' + esc(DECK[idx][0]) + (l.rev[i] ? ' (역)' : '') + '</span></span>').join('');
    const more = open ? '<div class="more">' + l.drawn.map((idx, i) => {
      const r = reading(idx, !!l.rev[i], LABELS[i], l.q);
      return '<div><div class="t">' + LABELS[i] + ' · ' + esc(DECK[idx][0]) + ' ' + (l.rev[i] ? '역방향' : '정방향') + '</div><p>' + esc(r.showMean ? r.mean : r.adv) + '</p></div>';
    }).join('') + '</div>' : '';
    const btns = A.confirm === l.id
      ? '<span class="confirm">이 편지를 지울까요? 지우면 되돌릴 수 없어요.</span><button class="tbtn red" type="button" data-act="adelok" data-id="' + l.id + '">지우기</button><button class="tbtn" type="button" data-act="adelno">취소</button>'
      : '<button class="tbtn" type="button" data-act="aopen" data-id="' + l.id + '" aria-expanded="' + open + '">' + (open ? '해석 접기' : '해석 보기') + '</button><button class="tbtn" type="button" data-act="adel" data-id="' + l.id + '">지우기</button>';
    return '<article class="sheet arow" style="box-shadow:none">' +
      '<div class="h"><span class="small">' + fmtTime(l.date) + '</span><span class="chip" style="background:var(--blue)">' + esc(l.topic) + '</span></div>' +
      '<p class="q">' + esc(l.q) + '</p><div class="minis">' + minis + '</div>' + more +
      '<div class="btns">' + btns + '</div></article>';
  }).join('');
}
async function adminDelete(id) {
  try {
    if (A.mode === 'server') await FB.adminDb.collection('letters').doc(id).delete();
    else saveLetters(loadLetters().filter((x) => x.id !== id));
    A.list = A.list.filter((l) => l.id !== id);
    A.confirm = null; A.open = A.open === id ? null : A.open;
  } catch (err) { A.confirm = null; alertAdmin('지우지 못했어요. 인터넷 연결과 권한을 확인해 주세요.'); }
  renderAdminStats(); renderAdminList();
}
function alertAdmin(msg) { A.error = ''; const box = document.getElementById('admin-sum'); if (box) box.textContent = msg; }
function leaveAdmin() {
  if (A.mode === 'server' && FB.adminAuth) FB.adminAuth.signOut().catch(() => {});
  A.list = []; A.open = null; A.confirm = null;
  go('home');
}
document.addEventListener('keydown', (e) => {
  if (S.screen !== 'pin') return;
  if (/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if (e.key === 'Backspace') pressKey('del');
});

function renderArchive() {
  const list = loadLetters().slice().reverse();
  view.innerHTML = '<div class="list pad">' +
    '<h1 style="font-size:26px">보관한 편지</h1>' +
    (list.length ? list.map((l) => '<button type="button" class="sheet item" style="box-shadow:none" data-act="openkept" data-id="' + l.id + '">' +
      '<div class="d">' + fmtDate(l.date) + '</div>' +
      '<div class="q">' + esc(l.q) + '</div>' +
      '<div class="c">' + l.drawn.map((idx, i) => LABELS[i] + ' ' + DECK[idx][0] + (l.rev[i] ? '(역)' : '')).join(' · ') + '</div></button>').join('')
      : '<p class="empty">아직 보관한 편지가 없어요.<br>답장을 받은 뒤 ‘편지 보관하기’를 눌러 보세요.</p>') +
    '</div>';
}

view.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'write') { S.archived = null; go('write'); }
  else if (act === 'archive') go('archive');
  else if (act === 'send') {
    if (!S.q.trim()) { document.getElementById('err').hidden = false; return; }
    go('sending');
  }
  else if (act === 'pick') {
    if (DATA_PROBLEM) return;
    const picked = [];
    while (picked.length < 3) { const r = Math.floor(Math.random() * DECK.length); if (picked.indexOf(r) < 0) picked.push(r); }
    Object.assign(S, { drawn: picked, rev: picked.map(() => Math.random() < 0.5), flipped: [false, false, false], sel: -1, kept: false, archived: null, date: Date.now() });
    go('env');
  }
  else if (act === 'open') {
    const env = document.getElementById('env');
    if (!env || env.classList.contains('open')) return;
    env.classList.add('open');
    timer = setTimeout(() => go('reveal'), 1000);
  }
  else if (act === 'flip') {
    const i = +el.dataset.i;
    const wasAll = S.flipped.every(Boolean);
    S.flipped[i] = true; S.sel = i;
    view.querySelectorAll('.card').forEach((c, k) => c.classList.toggle('sel', k === i));
    el.classList.add('up');
    const idx = S.drawn[i], rv = S.rev[i];
    el.setAttribute('aria-label', LABELS[i] + ' 카드 ' + DECK[idx][0] + (rv ? ' 역방향' : ' 정방향') + ' 해석 보기');
    const dir = el.parentNode.querySelector('.dir');
    dir.textContent = rv ? '역방향' : '정방향';
    if (S.flipped.every(Boolean)) { const h = view.querySelector('.hint'); if (h) h.remove(); }
    renderDetail();
    if (!wasAll) renderActions();
    const d = document.getElementById('detail');
    if (d && d.getBoundingClientRect().top > window.innerHeight - 120) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  else if (act === 'keep') {
    const shareBox = document.getElementById('share');
    const share = !!(shareBox && shareBox.checked);
    const rec = { id: String(Date.now()), date: S.date || Date.now(), q: S.q, drawn: S.drawn, rev: S.rev, shared: share };
    const list = loadLetters();
    list.push(rec);
    S.kept = saveLetters(list);
    S.shareMsg = share ? '운영자에게 보내는 중이에요…' : '';
    renderActions();
    if (share) {
      shareLetter(rec)
        .then(() => { S.shareMsg = '운영자에게도 보냈어요.'; })
        .catch(() => { S.shareMsg = '운영자에게는 보내지 못했어요. 내 기기에는 보관됐어요.'; })
        .then(() => { if (S.screen === 'reveal') renderActions(); });
    }
  }
  else if (act === 'link') { L.from = 'reveal'; L.friend = null; L.codeErr = ''; L.joinErr = ''; go('link'); }
  else if (act === 'linkhome') { L.from = 'home'; L.friend = null; L.codeErr = ''; go('link'); }
  else if (act === 'copycode') {
    const code = document.getElementById('my-code').textContent;
    const t = document.getElementById('code-toast');
    try { navigator.clipboard.writeText(code).then(() => { t.textContent = '코드를 복사했어요.'; }, () => { t.textContent = '코드를 길게 눌러 복사해 주세요.'; }); } catch (err) { t.textContent = '코드를 길게 눌러 복사해 주세요.'; }
  }
  else if (act === 'friend') {
    const v = document.getElementById('friend-code').value;
    const f = decodeLink(v);
    L.friend = f; L.codeErr = f ? '' : '코드 모양이 맞지 않아요. OB-로 시작하는 코드를 그대로 넣어 주세요.';
    renderLinkCode(linkMe());
    const input = document.getElementById('friend-code'); if (input) input.value = v;
  }
  else if (act === 'join') {
    const nick = (document.getElementById('nick').value || '').trim().slice(0, 10);
    if (!document.getElementById('adult').checked) { L.joinErr = '만 18세 이상이고 내용에 동의해야 참여할 수 있어요.'; renderLinkPool(); return; }
    if (!nick) { L.joinErr = '별명을 적어 주세요.'; renderLinkPool(); return; }
    L.joinErr = ''; el.disabled = true; el.textContent = '참여하는 중…';
    joinPool(linkMe(), nick).then(() => refreshPool()).catch(() => { L.joinErr = '참여하지 못했어요. 인터넷 연결을 확인해 주세요.'; renderLinkPool(); });
  }
  else if (act === 'refresh') refreshPool();
  else if (act === 'leavepool') { leavePool().then(() => { renderLinkPool(); renderLinkRooms(); updateLinkBtn(); }); }
  else if (act === 'ask') { el.disabled = true; askChat(el.dataset.uid); }
  else if (act === 'accept') { setRoomStatus(el.dataset.id, 'open').then((ok) => { if (ok) { L.room = el.dataset.id; go('chat'); } }); }
  else if (act === 'decline') setRoomStatus(el.dataset.id, 'closed');
  else if (act === 'openroom') { L.room = el.dataset.id; L.report = false; L.leaveAsk = false; L.pendingSend = null; go('chat'); }
  else if (act === 'send-msg') sendMsg(false);
  else if (act === 'sendanyway') sendMsg(true);
  else if (act === 'sendfix') { const v = L.pendingSend; L.pendingSend = null; renderCompose(); const t = document.getElementById('chat-text'); if (t) { t.value = v || ''; t.focus(); } }
  else if (act === 'reportopen') { L.report = true; L.leaveAsk = false; renderCompose(); }
  else if (act === 'reportcancel') { L.report = false; renderCompose(); }
  else if (act === 'reportsend') sendReport();
  else if (act === 'leaveask') { L.leaveAsk = true; L.report = false; renderCompose(); }
  else if (act === 'leaveno') { L.leaveAsk = false; renderCompose(); }
  else if (act === 'leaveok') { setRoomStatus(L.room, 'closed').then(() => { L.leaveAsk = false; go('link'); }); }
  else if (act === 'backlink') go('link');
  else if (act === 'door') go('pin');
  else if (act === 'key') pressKey(el.dataset.k);
  else if (act === 'logout') leaveAdmin();
  else if (act === 'afilter') { A.filter = el.dataset.t; renderAdminStats(); renderAdminList(); }
  else if (act === 'aopen') { A.open = A.open === el.dataset.id ? null : el.dataset.id; A.confirm = null; renderAdminList(); }
  else if (act === 'adel') { A.confirm = el.dataset.id; renderAdminList(); }
  else if (act === 'adelno') { A.confirm = null; renderAdminList(); }
  else if (act === 'adelok') adminDelete(el.dataset.id);
  else if (act === 'repview') viewReport(el.dataset.id, el.dataset.room);
  else if (act === 'repdone') reportDone(el.dataset.id);
  else if (act === 'newletter') { Object.assign(S, { q: '', archived: null, sel: -1, flipped: [false, false, false], kept: false }); go('write'); }
  else if (act === 'openkept') {
    const l = loadLetters().find((x) => x.id === el.dataset.id);
    if (!l) return;
    Object.assign(S, { q: l.q, drawn: l.drawn, rev: l.rev, flipped: [true, true, true], sel: 0, kept: true, archived: l.id, date: l.date });
    go('reveal');
  }
  else if (act === 'del') {
    saveLetters(loadLetters().filter((x) => x.id !== S.archived));
    S.archived = null;
    go('archive');
  }
});

document.getElementById('back').addEventListener('click', () => {
  let to = PREV[S.screen];
  if (S.screen === 'reveal' && S.archived) to = 'archive';
  if (S.screen === 'admin') return leaveAdmin();
  if (S.screen === 'link') return go(L.from === 'home' ? 'home' : 'reveal');
  if (S.screen === 'chat') { L.report = false; L.leaveAsk = false; return go('link'); }
  if (!to) return;
  if (to === 'env' || to === 'mail') Object.assign(S, { flipped: [false, false, false], sel: -1, kept: false });
  go(to);
});

render();
</script>
